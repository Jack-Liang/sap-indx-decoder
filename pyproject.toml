[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sap-indx-decoder"
version = "0.2.0"
description = "Decode SAP data clusters (INDX/STXL cluster tables, EXPORT TO DATABASE blobs) without an SAP system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jack-Liang" }]
keywords = ["sap", "indx", "cluster", "hana", "stxl", "abap", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
hana = ["hdbcli"]
dev = ["pytest"]
parquet = ["pyarrow"]

[project.scripts]
sap-indx-decoder = "sap_indx_decoder.cli:main"
indx = "sap_indx_decoder.cli:main"  # 短别名

[project.urls]
Repository = "https://github.com/Jack-Liang/sap-indx-decoder"
Issues = "https://github.com/Jack-Liang/sap-indx-decoder/issues"
Changelog = "https://github.com/Jack-Liang/sap-indx-decoder/blob/main/CHANGELOG.md"

[tool.maturin]
# 混合构建:Rust 原生扩展(sap_indx_decoder._native)+ 纯 Python 包
manifest-path = "native/Cargo.toml"
module-name = "sap_indx_decoder._native"
python-source = "."
features = ["pyo3/abi3-py39", "pyo3/extension-module"]
