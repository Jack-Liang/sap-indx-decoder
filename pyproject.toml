[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-indx-decoder"
version = "0.1.0"
description = "Decode SAP data clusters (INDX/STXL cluster tables, EXPORT TO DATABASE blobs) without an SAP system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jack-Liang" }]
keywords = ["sap", "indx", "cluster", "hana", "stxl", "abap", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
hana = ["hdbcli"]
dev = ["pytest"]

[project.scripts]
sap-indx-decoder = "indx_tool:main"

[tool.setuptools]
py-modules = ["indx_tool"]
