name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    wheels:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, target: x86_64-manylinux }
                    - { os: ubuntu-24.04-arm, target: aarch64-manylinux }
                    - { os: macos-15, target: aarch64-macos }
                    - { os: windows-latest, target: x86_64-windows }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: dtolnay/rust-toolchain@stable
            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
                  sccache: true
                  manylinux: auto
            - uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.target }}
                  path: dist

    sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist
            - uses: actions/upload-artifact@v4
              with:
                  name: sdist
                  path: dist

    publish:
        needs: [wheels, sdist]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        environment: pypi
        permissions:
            id-token: write # trusted publishing
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
